name: Quality

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    env:
      # Prisma generate/validate and Next build need a URL at config time, but
      # CI must never connect to a developer or production database.
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/teamflow_ci?schema=public
      DIRECT_URL: postgresql://postgres:postgres@127.0.0.1:5432/teamflow_ci?schema=public
      AUTH_SECRET: phase-20-ci-secret-at-least-32-characters-long
      AUTH_GOOGLE_ID: ci-browser-test-client-id
      AUTH_GOOGLE_SECRET: ci-browser-test-client-secret
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:generate
      - run: pnpm db:validate
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test:unit
      - run: pnpm test:migration:static
      - run: pnpm build
